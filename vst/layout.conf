# Shapey EQ -- 3DTHC. Written by tools/make_skin_art.py: edit the design there and rerun it, not this file.
# One page: master and theme on top, the curve display, then one column per band (switch, FREQ, GAIN or SLOPE, Q).
# Every themed part is one line per theme (when=theme:<n>). Coordinates are layout space (skin y + 86).

theme_ink=e6eef6
theme_ink_dim=7d8b9a
theme_accent=d7dce2
theme_accent_hi=ffffff
theme_line=2b3746
theme_box=10151b
theme_lcd=0a0e13
theme_seg_active=d7dce2
theme_seg_inactive=121820
theme_seg_active_tx=06121c
art_css=popup.css

[tab SHAPEY]
art file="artwork/bg_grey.svg" when=theme:0
art file="artwork/bg_classic.svg" when=theme:1
art file="artwork/bg_white.svg" when=theme:2
art file="artwork/bg_silver.svg" when=theme:3

# theme: value between the arrows
